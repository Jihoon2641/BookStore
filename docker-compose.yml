  bookstore-api:
    build:
      context: ./bookstore-api
      dockerfile: Dockerfile
    container_name: bookstore-api
    ports:
      - "8080:8080"
    volumes:
      - bookstore-logs:/app/logs
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://bookstore-db:3306/bookstore
      SPRING_DATASOURCE_USERNAME: bookstore
      SPRING_DATASOURCE_PASSWORD: 1234
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      NAVER_API_CLIENT_ID: ${NAVER_API_CLIENT_ID}
      NAVER_API_CLIENT_SECRET: ${NAVER_API_CLIENT_SECRET}
      PROMETHEUS_BASE_URL: http://prometheus:9090
    depends_on:
      bookstore-db:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:latest
    container_name: bookstore-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - bookstore-api

  chromadb:
    image: chromadb/chroma:latest
    container_name: bookstore-chromadb
    ports:
      - "8000:8000"
    volumes:
      - chromadb-data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
      - ALLOW_RESET=TRUE
    healthcheck:
      test: [ "CMD-SHELL", "bash -lc 'echo > /dev/tcp/127.0.0.1/8000'" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  bookstore-nl2sql:
    build:
      context: ./bookstore-nl2sql
      dockerfile: Dockerfile
    container_name: bookstore-nl2sql
    ports:
      - "8001:8000"
    env_file:
      - ./bookstore-nl2sql/.env
    environment:
      - MODEL_PATH=/app/models/multilingual-e5-large
      - DB_HOST=bookstore-db
      - DB_PORT=3306
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
    volumes:
      - ./models:/app/models
    depends_on:
      bookstore-db:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:latest
    container_name: bookstore-node-exporter
    ports:
      - "9100:9100"
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/containerd/.+)($|/)'
      - '--collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|mqueue|nsfs|overlay|proc|pstore|rpc_pipefs|securityfs|squashfs|sysfs|tracefs)$'
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: bookstore-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    depends_on:
      - bookstore-api
      - node-exporter
    restart: unless-stopped

volumes:
  bookstore-db-data:
  chromadb-data:
  prometheus-data:
  bookstore-logs:
